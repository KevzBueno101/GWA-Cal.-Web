<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Calculate your GWA easily with our free Windows app. Download now!">
    <meta name="keywords" content="GWA calculator, grades, Windows app">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>GWA Calculator - Calculate Your Grade Weighted Average</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/calculator.css">
    <link rel="icon" href="icon.ico">
</head>

<body>
    <nav class="navbar sticky-top">
        <span>
            <h3><img src="icon.ico" alt="logo" height="20px" width="20px">GWACal.</h3>
        </span>
        <button class="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul>
            <li><a href="index.html"><i class="fa-solid fa-download"></i> Download</a></li>
            <li><a href="web-cal.html"><i class="fa-solid fa-calculator"></i> Calculate Now</a></li>
            <li><a href="how.html"><i class="fa-solid fa-question"></i> How it Works</a></li>
            <li><a href="documentation.html"><i class="fa-solid fa-book"></i> Documentation</a></li>
            <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="calculator-container">
            <div class="calculator-header">
                <h1><i class="fa-solid fa-graduation-cap"></i> GWA Calculator</h1>
                <p>Enter your subjects, grades, and units to calculate your General Weighted Average</p>
            </div>

            <div class="label-row">
                <div>Subject Name</div>
                <div>Grade</div>
                <div>Units</div>
                <div></div>
            </div>

            <div id="subjectsContainer">
                <div class="subject-row">
                    <input type="text" placeholder="Subject Name (e.g., Math 101)" class="subject-name">
                    <input type="number" step="0.01" min="1" max="5" placeholder="Grade (1.00-5.00)" class="grade">
                    <input type="number" step="0.5" min="0.5" max="10" placeholder="Units" class="units">
                    <button class="btn-remove" onclick="removeSubject(this)"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>

            <button class="btn-add" onclick="addSubject()">
                <i class="fa-solid fa-plus"></i> Add Subject
            </button>

            <div class="button-group">
                <button class="btn-calculate" onclick="calculateGWA()">
                    <i class="fa-solid fa-calculator"></i> Calculate GWA
                </button>
                <button class="btn-reset" onclick="resetCalculator()">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>

            <div class="result-box" id="resultBox">
                <h2>Your General Weighted Average</h2>
                <div class="gwa-display" id="gwaDisplay">0.00</div>
                <p id="totalUnits">Total Units: 0</p>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <p>&copy; 2024 GWACal. All rights reserved.</p>
    </footer>

    <script>
        // Hamburger menu toggle
        document.querySelector('.hamburger').addEventListener('click', function() {
            document.querySelector('.navbar').classList.toggle('open');
            this.classList.toggle('open');
        });

        function addSubject() {
            const container = document.getElementById('subjectsContainer');
            const newRow = document.createElement('div');
            newRow.className = 'subject-row';
            newRow.innerHTML = `
                <input type="text" placeholder="Subject Name (e.g., Math 101)" class="subject-name">
                <input type="number" step="0.01" min="1" max="5" placeholder="Grade (1.00-5.00)" class="grade">
                <input type="number" step="0.5" min="0.5" max="10" placeholder="Units" class="units">
                <button class="btn-remove" onclick="removeSubject(this)"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(newRow);
        }

        function removeSubject(button) {
            const rows = document.querySelectorAll('.subject-row');
            if (rows.length > 1) {
                button.closest('.subject-row').remove();
            } else {
                alert('You must have at least one subject!');
            }
        }

        function calculateGWA() {
            const rows = document.querySelectorAll('.subject-row');
            let totalWeightedGrades = 0;
            let totalUnits = 0;
            let isValid = true;

            rows.forEach(row => {
                const grade = parseFloat(row.querySelector('.grade').value);
                const units = parseFloat(row.querySelector('.units').value);

                if (!grade || !units || grade < 1 || grade > 5 || units <= 0) {
                    isValid = false;
                    return;
                }

                totalWeightedGrades += grade * units;
                totalUnits += units;
            });

            if (!isValid) {
                alert('Please fill in all fields with valid values!\nGrade: 1.00-5.00\nUnits: > 0');
                return;
            }

            if (totalUnits === 0) {
                alert('Total units cannot be zero!');
                return;
            }

            const gwa = totalWeightedGrades / totalUnits;
            
            document.getElementById('gwaDisplay').textContent = gwa.toFixed(2);
            document.getElementById('totalUnits').textContent = `Total Units: ${totalUnits.toFixed(1)}`;
            document.getElementById('resultBox').classList.add('show');
        }

        function resetCalculator() {
            // Clear all subject rows except the first one
            const container = document.getElementById('subjectsContainer');
            const firstRow = container.querySelector('.subject-row');
            container.innerHTML = '';
            container.appendChild(firstRow);
            
            // Clear inputs in the first row
            firstRow.querySelector('.subject-name').value = '';
            firstRow.querySelector('.grade').value = '';
            firstRow.querySelector('.units').value = '';
            
            // Hide result box
            document.getElementById('resultBox').classList.remove('show');
        }
    </script>
</body>

</html>
